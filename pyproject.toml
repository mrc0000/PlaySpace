[project]
name = "uap-archive"
version = "0.1.0"
description = "Manifest-first index of the May 8, 2026 U.S. UAP disclosure (war.gov + NARA RG-615)"
readme = "README.md"
license = { text = "CC0-1.0" }
requires-python = ">=3.11"
authors = [{ name = "PlaySpace contributors" }]
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=8.5",
    "aiolimiter>=1.1",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
uap-archive = "uap_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uap_archive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM117"]
